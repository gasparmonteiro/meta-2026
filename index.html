</script><script>
const view=document.getElementById('view'), back=document.getElementById('back'), title=document.getElementById('title'), subtitle=document.getElementById('subtitle');
let atual=null, candidato='barranco';
const fmt=n=>Number(n||0).toLocaleString('pt-BR');
const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
function net(){document.getElementById('offline').style.display=navigator.onLine?'none':'block'} addEventListener('online',net);addEventListener('offline',net);net();
function home(){
 atual=null; back.style.display='none'; title.textContent='Consulta Eleitoral 2022/2026';subtitle.textContent='Mato Grosso • 142 municípios • consulta offline';
 view.innerHTML=`<input id="q" class="search" placeholder="Buscar município..." autocomplete="off">
 <div class="head"><div>#</div><div>MUNICÍPIO</div><div style="text-align:right">L_2026</div><div style="text-align:right">B_2022</div><div style="text-align:right">B_2026</div><div style="text-align:right">META 2026</div><div></div></div><div id="lista"></div>`;
 const q=document.getElementById('q'); q.oninput=()=>renderList(q.value); renderList('');
}
function renderList(q){
 const f=DADOS.filter(m=>norm(m.name).includes(norm(q)));
 document.getElementById('lista').innerHTML=f.map((m,i)=>`<div class="row" data-name="${m.name.replace(/"/g,'&quot;')}">
 <div class="rank">${i+1}</div><div class="mun">${m.name}</div><div><div class="num">${fmt(m.l2026||0)}</div></div>
 <div><div class="num">${fmt(m.barranco)}</div></div><div><div class="num">${fmt(m.b2026||0)}</div></div><div><div class="num">${fmt(m.meta)}</div><div class="sub">${m.meta>=m.barranco?'+':''}${fmt(m.meta-m.barranco)}</div></div><div class="arrow">›</div></div>`).join('')||'<div class="empty">Município não encontrado.</div>';
 document.querySelectorAll('.row').forEach(el=>el.onclick=()=>openMun(el.dataset.name));
}
function openMun(name){
 atual=DADOS.find(m=>m.name===name); if(!atual)return; back.style.display='block';back.onclick=home;title.textContent=atual.name;subtitle.textContent='Resultados 2026 • comparação B_2022 × B_2026';
 renderDetail();
}
function renderDetail(){
 const nb=atual.bairros.length, locais=new Set(), secs=new Set();
 atual.bairros.forEach(b=>b.locais.forEach(l=>{locais.add(l.zona+'-'+l.codigo);l.secoes.forEach(s=>secs.add(s.zona+'-'+s.secao))}));
 const falta=atual.meta-atual.barranco;
 view.innerHTML=`<div class="summary"><h2>${atual.name}</h2><div class="kpis">
 <div class="kpi"><span>L_2026</span><strong>${fmt(atual.l2026||0)}</strong></div><div class="kpi"><span>B_2022</span><strong>${fmt(atual.barranco)}</strong></div><div class="kpi"><span>B_2026</span><strong>${fmt(atual.b2026||0)}</strong></div><div class="kpi"><span>META 2026</span><strong>${fmt(atual.meta)}</strong></div></div>
 <div class="sub" style="margin-top:9px;text-align:left">${falta>=0?'Faltam '+fmt(falta)+' votos para a meta':'Meta inferior ao resultado de 2022 em '+fmt(Math.abs(falta))+' votos'}</div></div>
 <div class="stats"><strong>${nb}</strong> bairros &nbsp; <strong>${locais.size}</strong> locais de votação &nbsp; <strong>${secs.size}</strong> seções</div>
 <div class="dualhead"><span></span><span>L_2026</span><span>B_2022</span><span>B_2026</span></div><div id="bairros"></div>`;
 renderBairros();
}
function renderBairros(){
 const bs=[...atual.bairros].sort((a,b)=>b.barranco-a.barranco||a.name.localeCompare(b.name));
 document.getElementById('bairros').innerHTML=bs.map(b=>{
  const locs=[...b.locais].sort((a,z)=>z.barranco-a.barranco||a.name.localeCompare(z.name));
  return `<div class="card"><div class="item dual"><div class="chev">▶</div><div class="name">${b.name}</div><div class="votePair lula">${fmt(b.l2026||0)}</div><div class="votePair barranco">${fmt(b.barranco)}</div><div class="votePair">${fmt(b.b2026||0)}</div></div>
  <div class="children">${locs.map(l=>`<div class="child"><div class="localLine dualLocal"><div><div class="localName">▶ &nbsp;${l.name}</div><div class="localMeta">Zona ${l.zona} • Local ${l.codigo}</div></div><div class="votePair lula">${fmt(l.l2026||0)}</div><div class="votePair barranco">${fmt(l.barranco)}</div><div class="votePair">${fmt(l.b2026||0)}</div></div>
  <div class="secWrap"><div class="sec secHead"><span>SEÇÃO</span><span>L_2026</span><span>B_2022</span><span>B_2026</span></div>${l.secoes.map(s=>`<div class="sec dualSec"><span>Zona ${s.zona} • Seção ${s.secao}</span><strong>${fmt(s.l2026||0)}</strong><strong>${fmt(s.barranco)}</strong><strong>${fmt(s.b2026||0)}</strong></div>`).join('')}</div></div>`).join('')}</div></div>`}).join('');
 document.querySelectorAll('.card>.item').forEach(el=>el.onclick=()=>{el.parentElement.classList.toggle('open');el.querySelector('.chev').textContent=el.parentElement.classList.contains('open')?'▼':'▶'});
 document.querySelectorAll('.localLine').forEach(el=>el.onclick=e=>{e.stopPropagation();el.parentElement.classList.toggle('open');const n=el.querySelector('.localName');n.innerHTML=(el.parentElement.classList.contains('open')?'▼':'▶')+' &nbsp;'+n.textContent.replace(/^[▶▼]\\s*/,'')});
}
home();
